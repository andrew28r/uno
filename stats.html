<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Player Stats</title>

    <link
        rel="stylesheet"
        href="stats.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body>

    <h1>Player Stats</h1>


    <!-- =========================
         STATS TABLE
    ========================== -->

    <div id="stats"></div>


    <!-- =========================
         EDIT PLAYER POPUP
    ========================== -->

    <div
        id="editPlayerPopup"
        class="popup hidden"
    >

        <div class="popup-content">

            <h2>Edit Player</h2>


            <!-- PLAYER NAME -->

            <label for="editPlayerName">
                Player Name
            </label>

            <input
                type="text"
                id="editPlayerName"
                placeholder="Player name"
                maxlength="30"
            >


            <!-- GAMES -->

            <div class="edit-stat">

                <label for="editGames">
                    Games Played
                </label>

                <input
                    type="number"
                    id="editGames"
                    min="0"
                    step="1"
                >

            </div>


            <!-- WINS -->

            <div class="edit-stat">

                <label for="editWins">
                    Wins
                </label>

                <input
                    type="number"
                    id="editWins"
                    min="0"
                    step="1"
                >

            </div>


            <!-- STARS -->

            <div class="edit-stat">

                <label for="editStars">
                    Stars
                </label>

                <input
                    type="number"
                    id="editStars"
                    min="0"
                    step="1"
                >

            </div>


            <!-- BUTTONS -->

            <button
                id="savePlayerButton"
                type="button"
            >
                Save
            </button>


            <button
                id="closeEditPlayerButton"
                type="button"
            >
                Cancel
            </button>


            <!-- DEACTIVATE -->

            <button
                id="deletePlayerButton"
                type="button"
            >
                Deactivate Player
            </button>

        </div>

    </div>


    <script src="stats.js"></script>

</body>

</html>
